[package]
name = "alpenglow-core"
version = "0.1.0"
edition = "2024"
description = "Educational model of Solana Alpenglow votor consensus (SIMD-0326), compiled to WASM"
license = "MIT"
repository = "https://github.com/alizeeshan1234/alpenglow-viz"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }

# Only pulled in when compiling to WebAssembly, so native `cargo test` stays clean.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
